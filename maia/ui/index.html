<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maia</title>
<style>
  :root{
    --bg:#0e1016; --bg2:#151925; --panel:#171b27; --panel2:#1c2130;
    --line:#252b3b; --txt:#e7ebf3; --muted:#8b93a7; --faint:#5b6379;
    --user:#2b3350; --maia:#1c2434;
    --accent:#8b7cff; --accent2:#4fd6e0; --ok:#43d19e; --err:#ff6b7d; --warn:#ffcf6b;
    --grad:linear-gradient(135deg,#8b7cff,#4fd6e0);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 700px at 80% -10%,#1a2033 0%,var(--bg) 60%);
    color:var(--txt);display:flex;flex-direction:column;overflow:hidden;
  }
  /* ---- top bar ---- */
  header{
    display:flex;align-items:center;gap:14px;padding:14px 20px;
    border-bottom:1px solid var(--line);background:rgba(15,17,24,.6);backdrop-filter:blur(8px);
  }
  .orb{width:34px;height:34px;border-radius:50%;background:var(--grad);
    box-shadow:0 0 0 0 rgba(139,124,255,.5);flex:none;position:relative;transition:.3s}
  .orb::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#0e1016;opacity:.35}
  body.speaking .orb{animation:pulse 1.1s infinite}
  body.thinking .orb{animation:spin 1.6s linear infinite;background:conic-gradient(from 0deg,#8b7cff,#4fd6e0,#8b7cff)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(139,124,255,.5)}70%{box-shadow:0 0 0 16px rgba(139,124,255,0)}100%{box-shadow:0 0 0 0 rgba(139,124,255,0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.3px}
  h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .status{margin-left:4px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  body.listening .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  body.thinking .dot{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  body.speaking .dot{background:var(--accent2);box-shadow:0 0 8px var(--accent2)}
  .badges{margin-left:auto;display:flex;gap:8px}
  .badge{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:999px;background:var(--panel)}
  .badge b{color:var(--txt);font-weight:600}
  /* ---- layout ---- */
  main{flex:1;display:grid;grid-template-columns:1.15fr .85fr;gap:0;min-height:0}
  .col{display:flex;flex-direction:column;min-height:0}
  .col.conv{border-right:1px solid var(--line)}
  .col-h{padding:11px 20px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line)}
  .feed{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
  .feed::-webkit-scrollbar{width:9px}
  .feed::-webkit-scrollbar-thumb{background:#2a3142;border-radius:9px;border:2px solid transparent;background-clip:content-box}
  /* ---- chat bubbles ---- */
  .msg{max-width:82%;padding:11px 15px;border-radius:16px;line-height:1.5;font-size:15px;
    animation:rise .28s ease;word-wrap:break-word;white-space:pre-wrap}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg .who{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin-bottom:4px;display:block}
  .msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:5px}
  .msg.user .who{color:#9fb0e6}
  .msg.maia{align-self:flex-start;background:var(--maia);border-bottom-left-radius:5px;border:1px solid var(--line)}
  .msg.maia .who{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
  /* ---- brain panel ---- */
  .brain{font-family:"Cascadia Code",ui-monospace,Consolas,monospace;font-size:13px;line-height:1.55}
  .turn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;animation:rise .28s ease}
  .turn .q{color:var(--accent2);font-size:12px;margin-bottom:8px;font-family:"Segoe UI",sans-serif}
  .turn .claude{color:#cdd4e4;white-space:pre-wrap;word-wrap:break-word}
  .tool{display:flex;gap:8px;align-items:flex-start;margin:7px 0;padding:6px 9px;border-radius:8px;background:var(--panel2)}
  .tool .ic{flex:none;width:18px;text-align:center}
  .tool .nm{color:var(--accent);font-weight:600}
  .tool .io{color:var(--muted);word-break:break-word}
  .tool.out .ic{color:var(--ok)}
  .tool.err .ic{color:var(--err)}
  .empty{color:var(--faint);text-align:center;margin-top:40px;font-size:14px}
  .cursor{display:inline-block;width:7px;height:15px;background:var(--accent2);vertical-align:-2px;animation:blink 1s steps(2) infinite;margin-left:1px}
  @keyframes blink{50%{opacity:0}}
</style>
</head>
<body class="listening">
  <header>
    <div class="orb"></div>
    <h1>M<span>ai</span>a</h1>
    <div class="status"><span class="dot"></span><span id="statusText">Escuchando</span></div>
    <div class="badges">
      <div class="badge">cerebro <b id="bBrain">—</b></div>
      <div class="badge">voz <b id="bStt">—</b></div>
    </div>
  </header>
  <main>
    <div class="col conv">
      <div class="col-h">Conversación</div>
      <div class="feed" id="conv"><div class="empty" id="convEmpty">Di algo… te escucho.</div></div>
    </div>
    <div class="col">
      <div class="col-h">Cerebro · Claude en vivo</div>
      <div class="feed brain" id="brain"><div class="empty" id="brainEmpty">Aquí verás lo que Claude piensa y las herramientas que usa.</div></div>
    </div>
  </main>
<script>
const conv=document.getElementById('conv'), brain=document.getElementById('brain');
const statusText=document.getElementById('statusText');
let lastConv=null, lastConvKind=null, curTurn=null, curClaude=null;

function atBottom(el){return el.scrollHeight-el.scrollTop-el.clientHeight<80}
function scroll(el){el.scrollTop=el.scrollHeight}

function setStatus(state){
  document.body.className=state;
  statusText.textContent={listening:'Escuchando',thinking:'Pensando',speaking:'Hablando'}[state]||'Escuchando';
}
function bubble(kind,text){
  document.getElementById('convEmpty')?.remove();
  const stick=atBottom(conv);
  // coalesce frases consecutivas del mismo hablante
  if(lastConv && lastConvKind===kind){ lastConv.querySelector('.body').textContent+=' '+text; }
  else{
    const el=document.createElement('div'); el.className='msg '+kind;
    el.innerHTML='<span class="who">'+(kind==='user'?'Tú':'Maia')+'</span><span class="body"></span>';
    el.querySelector('.body').textContent=text;
    conv.appendChild(el); lastConv=el; lastConvKind=kind;
  }
  if(stick)scroll(conv);
}
function newTurn(q){
  document.getElementById('brainEmpty')?.remove();
  curTurn=document.createElement('div'); curTurn.className='turn';
  curTurn.innerHTML='<div class="q">▸ '+escapeHtml(q)+'</div><div class="claude"></div>';
  curClaude=curTurn.querySelector('.claude');
  brain.appendChild(curTurn); scroll(brain);
}
function claudeText(t){
  if(!curTurn)newTurn('…');
  const stick=atBottom(brain);
  curClaude.textContent+=(curClaude.textContent?' ':'')+t;
  if(stick)scroll(brain);
}
function toolLine(name,io,text,ok){
  if(!curTurn)newTurn('…');
  const stick=atBottom(brain);
  const el=document.createElement('div');
  el.className='tool '+(io==='out'?(ok===false?'err':'out'):'in');
  const ic=io==='out'?(ok===false?'✕':'✓'):'➜';
  el.innerHTML='<span class="ic">'+ic+'</span>'+(io==='in'?'<span class="nm">'+escapeHtml(name)+'</span> ':'')+'<span class="io"></span>';
  el.querySelector('.io').textContent=text||'';
  curClaude.after(el); // tools después del texto del turno
  if(stick)scroll(brain);
}
function escapeHtml(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function handle(ev){
  if(ev.kind==='meta'){ if(ev.brain)document.getElementById('bBrain').textContent=ev.brain;
    if(ev.stt)document.getElementById('bStt').textContent=ev.stt; return; }
  if(ev.kind==='status'){ setStatus(ev.state); return; }
  if(ev.kind==='user'){ bubble('user',ev.text); newTurn(ev.text); return; }
  if(ev.kind==='maia'){ bubble('maia',ev.text); return; }
  if(ev.kind==='claude'){ claudeText(ev.text); return; }
  if(ev.kind==='tool'){ toolLine(ev.name,ev.io,ev.text,ev.ok); return; }
}

// ---- WebSocket con reconexión ----
let ws;
function connect(){
  ws=new WebSocket('ws://127.0.0.1:8760');
  ws.onmessage=e=>{try{handle(JSON.parse(e.data))}catch(_){}} ;
  ws.onopen=()=>setStatus('listening');
  ws.onclose=()=>{setTimeout(connect,1200)};
  ws.onerror=()=>{try{ws.close()}catch(_){}};
}
connect();
</script>
</body>
</html>
